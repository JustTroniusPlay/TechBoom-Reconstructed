
[tables]
	#If false, disables the GunSmith table recipes for guns.
	enableGunTable = false
	#If false, disables the GunSmith table recipes for attachments.
	enableAttachmentTable = false
	#If false, disables the GunSmith table recipes for ammo.
	enableAmmoTable = true

